name: Build VASU Android APK

# Builds the native Gradle project at the repo root (app/ module) — the
# Kotlin/Compose app that contains the actual assistant code. The legacy
# Capacitor shell under android/ is NOT the source of truth for CI.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK for runner
        run: |
          # local.properties is machine-specific; point it at the runner SDK.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # aapt2 override targets an aarch64 host; runners use the Maven aapt2.
          sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Run Unit Tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VASU-Assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
